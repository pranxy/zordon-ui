name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint library
        run: npm run lint:lib

      - name: Build library package
        run: npm run build:lib

      - name: Run library tests with coverage
        run: npm run test:lib:coverage

      - name: Check browser test types
        run: npm run typecheck:browser

      - name: Lint browser tests and fixtures
        run: npm run lint:browser

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        run: npm run test:browser

      - name: Build documentation application
        run: npm run build:docs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
