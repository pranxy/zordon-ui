name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prefix-floor-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install supported Tailwind floor
        run: npm install --no-save --package-lock=false --ignore-scripts tailwindcss@4.1.0 @tailwindcss/postcss@4.1.0

      - name: Verify class-prefix compatibility at the Tailwind floor
        run: node --test tools/class-prefix-compatibility.test.mjs

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint library
        run: npm run lint:lib

      - name: Lint SSR example
        run: npm run lint:ssr

      - name: Lint documentation application
        run: npm run lint:docs

      - name: Build library package
        run: npm run build:lib

      - name: Check public API report
        run: npm run check:api

      - name: Test repository tooling
        run: npm run test:tooling

      - name: Check package bundle budgets
        run: npm run check:bundle-size

      - name: Verify package publish dry run
        run: npm run release:package-dry-run

      - name: Run library tests with coverage
        run: npm run test:lib:coverage

      - name: Check library public type contracts
        run: npm run test:lib:types

      - name: Check browser test types
        run: npm run typecheck:browser

      - name: Lint browser tests and fixtures
        run: npm run lint:browser

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        run: npm run test:browser

      - name: Build SSR example and run hydration smoke tests
        run: npm run test:ssr

      - name: Test documentation unit contracts
        run: npm run test:docs

      - name: Build production documentation application
        run: npm run build:docs

      - name: Check documentation performance policy
        run: npm run check:docs:performance

      - name: Run documentation SSR and crawlability checks
        run: npm run test:docs:ssr:built

      - name: Run documentation browser interaction checks
        run: npm run test:docs:browser:built

      - name: Run documentation accessibility checks
        run: npm run test:docs:a11y:built

      - name: Check documentation internal links
        run: npm run check:docs:links

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-ssr-report/
            playwright-docs-report/
          if-no-files-found: ignore
          retention-days: 14

  visual-regression:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Compare visual baselines
        run: npm run test:visual

      - name: Upload visual Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
