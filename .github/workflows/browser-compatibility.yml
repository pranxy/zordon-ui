name: Browser compatibility audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run desktop compatibility suite
        run: npx playwright test --project=${{ matrix.browser }} --retries=0 --trace=retain-on-failure --reporter=github,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-audit.json

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
